<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Attention">
    <style>

    </style>
</head>
<body>
<br>
<h1>Attention</h1>

<script>
    let hasSubscribed = false;
    let PUBLIC_VAPID_KEY = '';

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    }

    async function subscribe() {
        try {
            if (hasSubscribed) return;
            if (!PUBLIC_VAPID_KEY) return;

            if (Notification.permission === 'default') {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') return;
            }

            if (Notification.permission !== 'granted') return;

            // Subscribe directly via window.pushManager (No Service Worker needed)
            const existingSubscription = typeof window.pushManager.getSubscription === 'function'
                ? await window.pushManager.getSubscription()
                : null;

            const subscription = existingSubscription || await window.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
            });

            // Auto-save to server
            await fetch('/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(subscription)
            });

            hasSubscribed = true;

        } catch (err) {
            // console.error('Failed to subscribe:', err);
        }
    }

    // 启动时：检测是否已经完成过所有注册流程
    window.addEventListener('load', async () => {
        try {
            const res = await fetch('/config', { cache: 'no-store' });
            const config = await res.json();
            PUBLIC_VAPID_KEY = config.vapidPublicKey || '';
        } catch (err) {
            return;
        }
        if (Notification.permission === 'default') {
            await subscribe();
            return;
        }

        if (Notification.permission === 'granted') {
            if (typeof window.pushManager.getSubscription === 'function') {
                const existingSubscription = await window.pushManager.getSubscription();
                if (existingSubscription) {
                    hasSubscribed = true;
                    return;
                }
            }
            subscribe();
        }
    });
</script>
</body>

</html>
