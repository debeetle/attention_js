<!DOCTYPE html>
<!-- <html lang="en"> -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- <meta name="referrer" content="no-referrer"> -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/figure/icon.png">
    <link rel="apple-touch-icon" href="/figure/icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Attention">
    <style>
        @font-face {
            font-family: 'Universal';
            src: url('font/latinmodern-math.otf');
            unicode-range: U+0000-007F, U+0080-00FF;
        }

        @font-face {
            font-family: 'Universal';
            src: url('font/STZHONGS.TTF');
            unicode-range: U+4E00-9FFF;
        }

        :root {
            color-scheme: light dark;
            --main-borderadius: 18px;
            --main-pad: 12px;
            /* interpolate-size: allow-keywords; */
        }

        .permission-grant {
            display: inline-block;
            font-family: sans-serif;
            padding: 0.5rem;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            background-color: purple;
            color: white;
        }

        html,
        body {
            -webkit-overflow-scrolling: touch;
            font-family: 'Universal';
        }

        a {
            text-decoration: none;
        }

        .item {
            margin: 1rem 0;
            padding: var(--main-pad);
            border: 1px solid;
            border-color: rgb(from currentColor r g b / 15%);
            border-radius: var(--main-borderadius);
            max-width: 100%;
            box-shadow:
                0px 0px 1px rgb(from currentColor r g b / 3%),
                0px 0px 2px rgb(from currentColor r g b / 2%),
                0px 0px 3px rgb(from currentColor r g b / 1%);

            ul {
                padding-left: 1rem;
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
            }

            & .meta {
                font-family: sans-serif;
                font-size: 0.8rem;
                font-weight: bold;
                color: #ccc;
                display: flex;
                justify-content: space-between;
                align-items: end;
                margin-top: 0.5rem;

                & img {
                    display: block;
                    width: auto;
                    height: 1.5rem;
                }
            }

            figure {
                position: relative;
                margin: 0;
                border-radius: calc(var(--main-borderadius) - var(--main-pad));
                overflow: hidden;
                /* border: 1px solid; */
                /* border-color: rgb(from currentColor r g b / 20%); */
                box-shadow:
                    0px 0px 1px rgb(from currentColor r g b / 10%),
                    0px 0px 2px rgb(from currentColor r g b / 8%),
                    0px 0px 4px rgb(from currentColor r g b / 6%),
                    0px 0px 6px rgb(from currentColor r g b / 4%),
                    0px 0px 8px rgb(from currentColor r g b / 2%);

                img {
                    display: block;
                    width: 100%;
                    max-height: 20rem;
                    object-fit: cover;
                    background: white;
                }

                figcaption {
                    position: absolute;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    padding: 0.5rem;
                    color: white;
                    font-family: sans-serif;
                    font-weight: bold;
                    font-size: 0.8rem;
                    background-color: rgba(50, 50, 50, 1.0);
                    -webkit-backdrop-filter: blur(1rem);
                    backdrop-filter: blur(1rem);
                }
            }

            & .annotated {
                display: grid;
                grid-template-columns: auto 45%;
                gap: 0.5rem;

                img {
                    display: block;
                    max-width: 100%;
                    border-radius: 6px;
                    /* border: 1px solid;
                    border-color: rgb(from currentColor r g b / 20%); */
                    box-shadow:
                        0px 0px 1px rgb(from currentColor r g b / 10%),
                        0px 0px 2px rgb(from currentColor r g b / 8%),
                        0px 0px 4px rgb(from currentColor r g b / 6%),
                        0px 0px 6px rgb(from currentColor r g b / 4%),
                        0px 0px 8px rgb(from currentColor r g b / 2%);
                }
            }
        }

        nav {
            touch-action: none;
            cursor: pointer;
            overflow: hidden;
            position: fixed;
            bottom: env(safe-area-inset-bottom, 0px);
            left: 22px;
            height: 3rem;
            width: 3rem;
            z-index: 10;
            border-color: none;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
            background-color: color(display-p3 1 1 1 / 0.1);
            /* background: 
            radial-gradient(
            circle at 50% 15%, 
            rgba(255, 255, 255, 0.1), 
            rgba(255, 255, 255, 0.2)); */
            backdrop-filter: blur(0.5rem);
            box-shadow:
                inset 0 3px 5px -3px color(display-p3 1 1 1),
                inset 0 1px 8px -1px rgba(3, 7, 18, 0.2),
                /* inset 0 -5px 8px -5px rgba(255, 255, 255, 0.5),  */
                /* inset 0 -5px 8px -5px color(display-p3 1 1 1 / 0.5), */
                inset 0 -5px 8px -5px rgba(255, 255, 255, 0.4),
                0px 0px 1px rgb(from currentColor r g b / 10%),
                0px 1px 2px rgb(from currentColor r g b / 8%),
                0px 2px 4px rgb(from currentColor r g b / 6%),
                0px 3px 6px rgb(from currentColor r g b / 4%),
                0px 4px 8px rgb(from currentColor r g b / 2%);
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2), height 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2), border-radius 0.2s ease, background-color 0.2s ease;

            &::after {
                content: '';
                position: absolute;
                inset: 0;
                margin: auto;
                width: 1rem;
                height: 1rem;
                background: none;
                border: 1.5px solid currentColor;
                border-radius: 50%;
                opacity: 0.3;
                transition: opacity 0.1s ease;
                pointer-events: none;
            }

            li {
                visibility: hidden;
                display: flex;
                align-items: center;
                gap: 1rem;
                padding: 0.5rem;
                list-style: none;
                font-family: sans-serif;
                font-weight: bold;
                transition: background-color 0.1s ease;
            }

            &.open {
                height: 15rem;
                width: 12.5rem;
                border-radius: var(--main-borderadius);
                padding: 8px;
                background-color: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(1.5rem);
                box-shadow:
                    inset 0 0px 5px color(display-p3 1 1 1),
                    inset 0 0px 6px rgba(3, 7, 18, 0.2),
                    /* inset 0 -5px 8px rgba(255, 255, 255, 0.2),  */
                    /* inset 0 -5px 8px color(display-p3 1 1 1 / 0.2), */
                    0px 0px 1px rgb(from currentColor r g b / 10%),
                    0px 0px 2px rgb(from currentColor r g b / 8%),
                    0px 0px 4px rgb(from currentColor r g b / 6%),
                    0px 0px 6px rgb(from currentColor r g b / 4%),
                    0px 0px 8px rgb(from currentColor r g b / 2%);

                &::after {
                    opacity: 0;
                }

                li {
                    touch-action: none;
                    visibility: visible;
                    border-radius: calc(var(--main-borderadius) - 8px);
                }

                li img {
                    width: auto;
                    height: 1.5rem;
                    display: block;
                    width: auto;
                }

                & li.selected {
                    /* background-color: rgba(125, 125, 125, 0.2); */
                    background-color: rgb(from currentColor r g b / 0.1);
                    border: 1px solid rgb(from currentColor r g b / 0.05);
                }
            }
        }

    </style>
</head>

<body>

    <div id="history" style="touch-action: pan-y"></div>
    <nav>
        <li data-key=""><img src="/figure/Git_icon.svg" alt="">Flow</li>
        <li data-key="picture of the day"><img src="/figure/Wikipedia-logo-v2.svg" alt="">picture of the day</li>
        <li data-key="on this day"><img src="/figure/Wikipedia-logo-v2.svg" alt="">on this day</li>
        <li data-key="do you know"><img src="/figure/Wikipedia-logo-v2.svg" alt="">do you know</li>
        <li data-key="sspai"><img src="/figure/sspai.svg" alt="">sspai</li>
        <li data-key="ithome"><img src="/figure/IThome_logo.png" alt="">ithome</li>
    </nav>


    <script>
        const HISTORY_DB_NAME = 'attention';
        const HISTORY_DB_VERSION = 1;
        const HISTORY_STORE_NAME = 'news';
        const HISTORY_RENDER_LIMIT = 200;
        const SOURCE_META = {
            'picture of the day': { logo: '/figure/Wikipedia-logo-v2.svg' },
            'on this day': { logo: '/figure/Wikipedia-logo-v2.svg' },
            'do you know': { logo: '/figure/Wikipedia-logo-v2.svg' },
            'sspai': { logo: '/figure/sspai.svg' },
            'ithome': { logo: '/figure/IThome_logo.png' }
        };
        let PUBLIC_VAPID_KEY = '';
        let activeSource = '';
        let allItems = [];

        function transactionDone(transaction) {
            return new Promise((resolve, reject) => {
                transaction.oncomplete = () => resolve();
                transaction.onerror = () => reject(transaction.error || new Error('IndexedDB transaction failed'));
                transaction.onabort = () => reject(transaction.error || new Error('IndexedDB transaction aborted'));
            });
        }

        function openHistoryDb() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(HISTORY_DB_NAME, HISTORY_DB_VERSION);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    const store = db.objectStoreNames.contains(HISTORY_STORE_NAME)
                        ? request.transaction.objectStore(HISTORY_STORE_NAME)
                        : db.createObjectStore(HISTORY_STORE_NAME, { keyPath: 'id' });

                    if (!store.indexNames.contains('createdAt')) {
                        store.createIndex('createdAt', 'createdAt');
                    }
                    if (!store.indexNames.contains('publishedAt')) {
                        store.createIndex('publishedAt', 'publishedAt');
                    }
                    if (!store.indexNames.contains('sourceKey')) {
                        store.createIndex('sourceKey', 'sourceKey');
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error || new Error('Unable to open IndexedDB'));
            });
        }

        async function readHistoryFromDb(limit = HISTORY_RENDER_LIMIT) {
            const db = await openHistoryDb();
            try {
                const transaction = db.transaction(HISTORY_STORE_NAME, 'readonly');
                const index = transaction.objectStore(HISTORY_STORE_NAME).index('createdAt');
                const items = [];
                await new Promise((resolve, reject) => {
                    const request = index.openCursor(null, 'prev');
                    request.onsuccess = () => {
                        const cursor = request.result;
                        if (!cursor || items.length >= limit) {
                            resolve();
                            return;
                        }
                        items.push(cursor.value);
                        cursor.continue();
                    };
                    request.onerror = () => reject(request.error || new Error('Unable to read local history'));
                });
                return items;
            } finally {
                db.close();
            }
        }



        function renderHistory(items) {
            allItems = items;
            if (activeSource) items = items.filter(it => (it.sourceKey || '').toLowerCase() === activeSource);
            const root = document.getElementById('history');
            root.replaceChildren();
            if (!Array.isArray(items)) return;

            const fragment = document.createDocumentFragment();
            for (const [index, item] of items.entries()) {
                fragment.appendChild(buildHistory(item, index));
            }
            root.appendChild(fragment);
        }

        function appendSourceHeader(parent, item) {

            const title = document.createElement('div');
            title.textContent = item.title || '';
            parent.appendChild(title);
        }

        function buildHistory(item, index) {
            const historyItem = document.createElement('div');
            historyItem.className = 'item';
            const isOnThisDay = item.sourceKey === 'on this day';
            const isIthome = item.sourceKey === 'ithome';
            const isPotd = item.sourceKey === 'picture of the day';

            if (isPotd) {
                const pictureWrap = document.createElement('figure');

                const picture = document.createElement('img');
                picture.src = item.imageUrl;
                picture.alt = item.imageAlt || '';
                picture.decoding = 'async';
                picture.loading = index === 0 ? 'eager' : 'lazy';
                picture.fetchPriority = index === 0 ? 'high' : 'low';
                pictureWrap.appendChild(picture);

                const overlay = document.createElement('figcaption');

                if (isPotd && item.notiBody) {
                    const first = item.notiBody.trim();
                    if (first) {
                        overlay.textContent = first;
                    }
                }

                pictureWrap.appendChild(overlay);

                historyItem.appendChild(pictureWrap);

                if (!isPotd) appendBody(historyItem, item);
                appendMetaRow(historyItem, item);
                return historyItem;
            }

            if (isOnThisDay) {
                appendOnThisDayBody(historyItem, item);
                appendMetaRow(historyItem, item);
                return historyItem;
            }

            appendSourceHeader(historyItem, item);
            appendBody(historyItem, item);
            appendMetaRow(historyItem, item);
            return historyItem;
        }

        function appendMetaRow(parent, item) {
            const row = document.createElement('div');
            row.className = 'meta';
            const sourceMeta = SOURCE_META[(item.sourceKey)];

            const source = document.createElement('div');
            source.textContent = (item.sourceKey || '') + ' ' + elapsedHoursText(item.publishedAt);
            row.appendChild(source);

            if (item.link && sourceMeta.logo) {
                const more = document.createElement('a');
                more.href = item.link;
                // more.target = '_blank';
                const logo = document.createElement('img');
                logo.src = sourceMeta.logo;
                logo.alt = item.sourceKey || '';
                logo.decoding = 'async';
                logo.loading = 'lazy';
                logo.fetchPriority = 'low';
                more.appendChild(logo);
                row.appendChild(more);
            }

            parent.appendChild(row);
        }

        function appendBody(parent, item) {
            if (item.sourceKey === 'on this day') {
                appendOnThisDayBody(parent, item);
                return;
            }
            if (item.sourceKey === 'ithome') return;
            if (!item.content) return;

            const articleText = document.createElement('div');
            if (item.sourceKey === 'sspai') {
                articleText.style.paddingTop = '0.5rem';
            }
            if (item.content) {
                articleText.innerHTML = item.content;
            }

            parent.appendChild(articleText);
        }

        function appendOnThisDayBody(parent, item) {
            const heading = document.createElement('p');
            heading.innerHTML = item.title;
            heading.style.marginTop = "0";

            const annotated = document.createElement('div');
            annotated.className = 'annotated';
            const annotatedText = document.createElement('div');
            annotatedText.innerHTML = item.content;
            const annotatedPic = document.createElement('img');
            annotatedPic.src = item.imageUrl;
            annotated.appendChild(annotatedText);
            annotated.appendChild(annotatedPic);
            parent.appendChild(heading);
            parent.appendChild(annotated);
        }

        function moveChildren(from, to) {
            while (from.firstChild) {
                to.appendChild(from.firstChild);
            }
        }

        function unwrapElement(element) {
            const parent = element.parentNode;
            if (!parent) return;
            while (element.firstChild) {
                parent.insertBefore(element.firstChild, element);
            }
            parent.removeChild(element);
        }

        function elapsedHoursText(value) {
            const publishedAt = Date.parse(value || '');
            if (!Number.isFinite(publishedAt)) return '';
            const hours = Math.max(0, Math.floor((Date.now() - publishedAt) / (60 * 60 * 1000)));
            return `${hours}h`;
        }

        async function renderLocalHistory() {
            try {
                renderHistory(await readHistoryFromDb());
            } catch {
            }
        }

        async function addItemsToDb(items) {
            const db = await openHistoryDb();
            try {
                const transaction = db.transaction(HISTORY_STORE_NAME, 'readwrite');
                const store = transaction.objectStore(HISTORY_STORE_NAME);
                for (const item of items) {
                    store.put(item);
                }
                await transactionDone(transaction);
            } finally {
                db.close();
            }
        }

        async function syncHistory() {
            try {
                let since = '';
                if (allItems.length > 0) {
                    since = allItems[0].createdAt || '';
                }

                const url = since ? `/history?since=${encodeURIComponent(since)}` : '/history';
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) return;
                const payload = await res.json();
                if (!payload || !payload.ok || !Array.isArray(payload.items) || payload.items.length === 0) return;

                await addItemsToDb(payload.items);
                await renderLocalHistory();
            } catch {
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function subscribe() {
            const permission = Notification.permission === 'granted'
                ? 'granted'
                : await Notification.requestPermission();
            if (permission !== 'granted') return;

            const subscription = await window.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
            });

            await fetch('/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(subscription)
            });


        }

        window.addEventListener('DOMContentLoaded', async () => {

            const nav = document.querySelector('nav');

            let activePointerId = null;

            nav.addEventListener('pointerdown', (e) => {
                if (activePointerId === null) {
                    activePointerId = e.pointerId;
                    nav.classList.add('open');
                    nav.setPointerCapture(e.pointerId);

                }
            });

            nav.addEventListener('pointermove', (e) => {
                if (e.pointerId !== activePointerId) return;

                const el = document.elementFromPoint(e.clientX, e.clientY);
                nav.querySelectorAll('li').forEach(li =>
                    li.classList.toggle('selected', li === el || li.contains(el))
                );
                const key = el?.closest('li')?.dataset.key;
                if (key !== undefined && key != activeSource) {
                    activeSource = key;
                    renderHistory(allItems);
                }
            });

            document.addEventListener('pointerup', (e) => {
                if (e.pointerId !== activePointerId) return;
                cleanup();
            }, { capture: true, passive: true });
            document.addEventListener('pointercancel', (e) => {
                if (e.pointerId !== activePointerId) return;
                cleanup();
            }, { capture: true, passive: true });

            function cleanup() {
                nav.classList.remove('open');
                nav.querySelectorAll('li').forEach(li => li.classList.remove('selected'));
                if (activePointerId !== null) {
                    try {
                        nav.releasePointerCapture(activePointerId);
                    } catch (e) { }
                }
                activePointerId = null;
            }

            renderLocalHistory();
            syncHistory();

            try {
                const res = await fetch('/config', { cache: 'no-store' });
                const config = await res.json();
                PUBLIC_VAPID_KEY = config.vapidPublicKey || '';
            } catch {
                return;
            }

            if (Notification.permission === 'granted') {
                subscribe();
            } else if (Notification.permission === 'default') {
                const registerBtn = document.createElement('div');
                registerBtn.className = "permission-grant";
                registerBtn.textContent = "Enable Push Notifications";
                registerBtn.addEventListener('click', subscribe, { once: true });
                document.body.insertBefore(registerBtn, document.body.firstChild);
            }

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js', { type: 'module' });
            }
        });
    </script>

</body>

</html>
