<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Attention">
    <style>
        @font-face {
            font-family: 'Source Code Pro';
            src: url('SourceCodePro-Regular.ttf.woff2') format('woff2');
        }

        html,
        body {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        #enable-notifications {
            display: none;
        }

        .notification {
            margin: 1rem 0;
            padding: 6px;
            border: 2px solid #888;
            border-radius: 10px;
            text-align: justify;
            text-justify: inter-ideograph; /* 专门针对中日韩字符 */
        }

        .notification.no-image {
            display: grid;
            grid-template-columns: 30% 70%;
            gap: 1rem;
        }


        .favicon {
            display: block;
            width: 100%;
            height: auto;
        }

        .title {
            font-family: sans-serif;
            font-weight: bold;
        }

        .time {
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .notification-time-row {
            text-align: right;
        }

        :root {
            color-scheme: light dark;
        }

        @media (prefers-color-scheme: dark) {
            .notification {
                border-color: #5a5a5a;
            }
        }

        /* wiki potd start*/
        .picture {
            display: block;
            max-width: 100%;
            height: auto;
            width: 100%;
        }

        .picture-wrap {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .picture-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
            display: inline-block;
            background: rgba(28, 24, 20, 0.2);
            -webkit-backdrop-filter: blur(1rem);
            backdrop-filter: blur(1rem);
        }

        .picture-title {
            font-family: sans-serif;
            font-weight: bold;
            color: inherit;
        }

        .picture-time {
            color: inherit;
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
        }

        p {
            margin: 0;
        }

        /* wiki potd end */

        /* wiki onthisday start */
        ul {
            margin: 0;
            list-style-type: none;
            padding-left: 0;
        }

        /* wiki onthisday end */
    </style>
</head>

<body>
    <button id="enable-notifications">Enable Notifications</button>
    <section id="history"></section>

    <script>
        let hasSubscribed = false;
        let PUBLIC_VAPID_KEY = '';

        function renderHistory(payload) {
            const root = document.getElementById('history');
            root.replaceChildren();
            if (!payload || !payload.ok || !Array.isArray(payload.items)) return;

            for (const [index, item] of payload.items.entries()) {
                root.appendChild(buildNotification(item, index));
            }
        }

        function buildNotification(item, index) {
            const notification = document.createElement('article');
            notification.className = `notification${item.imageUrl ? '' : ' no-image'}`;

            if (item.link) {
                notification.addEventListener('click', () => {
                    window.location.assign(item.link);
                });
            }

            if (item.imageUrl) {
                const pictureWrap = document.createElement('div');
                pictureWrap.className = 'picture-wrap';

                const picture = document.createElement('img');
                picture.className = 'picture';
                picture.src = item.imageUrl;
                picture.alt = item.title || item.sourceLabel || '';
                picture.decoding = 'async';
                picture.loading = index === 0 ? 'eager' : 'lazy';
                picture.fetchPriority = index === 0 ? 'high' : 'low';
                pictureWrap.appendChild(picture);

                const overlay = document.createElement('div');
                overlay.className = 'picture-overlay';

                const title = document.createElement('div');
                title.className = 'picture-title';
                title.textContent = displayLabel(item);
                overlay.appendChild(title);

                if (item.publishedAt && shouldShowPictureTime(item)) {
                    const time = document.createElement('div');
                    time.className = 'time picture-time';
                    time.textContent = formatChinaTime(item.publishedAt);
                    overlay.appendChild(time);
                }

                pictureWrap.appendChild(overlay);

                notification.appendChild(pictureWrap);

                appendBody(notification, item);
                return notification;
            }

            const left = document.createElement('div');
            const favicon = document.createElement('img');
            favicon.className = 'favicon';
            favicon.src = faviconFor(item.link);
            favicon.alt = item.title || item.sourceLabel || '';
            favicon.decoding = 'async';
            favicon.loading = 'lazy';
            favicon.fetchPriority = 'low';
            left.appendChild(favicon);
            appendTitle(left, item);

            const right = document.createElement('div');
            appendBody(right, item);

            notification.appendChild(left);
            notification.appendChild(right);
            appendTimeRow(notification, item);
            return notification;
        }

        function appendTitle(parent, item) {
            const title = document.createElement('div');
            title.className = 'title';
            title.textContent = displayLabel(item);
            parent.appendChild(title);
        }

        function appendTimeRow(parent, item) {
            if (!item.publishedAt) return;
            const row = document.createElement('div');
            row.className = 'notification-time-row';
            const time = document.createElement('div');
            time.className = 'time';
            time.textContent = formatChinaTime(item.publishedAt);
            row.appendChild(time);
            parent.appendChild(row);
        }

        function appendBody(parent, item) {
            const body = document.createElement('div');
            body.className = 'body';
            if (item.summaryHtml) {
                body.innerHTML = normalizeBodyHtml(truncateHtmlToSentences(item.summaryHtml, 3));
            }

            parent.appendChild(body);
        }

        function unwrapElement(element) {
            const parent = element.parentNode;
            if (!parent) return;
            while (element.firstChild) {
                parent.insertBefore(element.firstChild, element);
            }
            element.remove();
        }

        function normalizeBodyHtml(html) {
            if (!html) return '';
            const template = document.createElement('template');
            template.innerHTML = html;

            for (const image of Array.from(template.content.querySelectorAll('img'))) {
                image.remove();
            }

            for (const cell of Array.from(template.content.querySelectorAll('table, tbody, tr, td'))) {
                unwrapElement(cell);
            }

            for (const empty of Array.from(template.content.querySelectorAll('div, span, p'))) {
                if (empty.children.length === 0 && !empty.textContent.trim()) {
                    empty.remove();
                }
            }

            return template.innerHTML.trim();
        }

        function truncateHtmlToSentences(html, maxSentences) {
            const template = document.createElement('template');
            template.innerHTML = html || '';
            let sentenceCount = 0;
            let truncated = false;

            function trimNode(node) {
                if (truncated) {
                    node.remove();
                    return;
                }

                if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent || '';
                    for (let i = 0; i < text.length; i++) {
                        if (!isSentenceTerminator(text, i)) continue;
                        sentenceCount += 1;
                        if (sentenceCount >= maxSentences) {
                            node.textContent = text.slice(0, i + 1);
                            truncated = true;
                            return;
                        }
                    }
                    return;
                }

                const children = Array.from(node.childNodes);
                for (const child of children) {
                    trimNode(child);
                    if (truncated) {
                        let sibling = child.nextSibling;
                        while (sibling) {
                            const next = sibling.nextSibling;
                            sibling.remove();
                            sibling = next;
                        }
                        return;
                    }
                }
            }

            trimNode(template.content);
            return template.innerHTML.trim();
        }

        function isSentenceTerminator(text, index) {
            const ch = text[index];
            if (!/[.!?。！？]/.test(ch)) return false;

            const prev = index > 0 ? text[index - 1] : '';
            const next = index + 1 < text.length ? text[index + 1] : '';

            if (ch === '.' && /\d/.test(prev) && /\d/.test(next)) {
                return false;
            }

            return true;
        }

        function displayLabel(item) {
            return item.sourceLabel || item.title || 'Notification';
        }

        function shouldShowPictureTime(item) {
            return item.sourceKey !== 'rss:https://en.wikipedia.org/w/api.php?action=featuredfeed&feed=onthisday&feedformat=atom';
        }

        function faviconFor(link) {
            try {
                if (!link) return '/icon.png';
                const url = new URL(link);
                return `${url.origin}/favicon.ico`;
            } catch {
                return '/icon.png';
            }
        }

        function formatChinaTime(value) {
            try {
                const date = new Date(value);
                const parts = new Intl.DateTimeFormat('en-GB', {
                    timeZone: 'Asia/Shanghai',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: false
                }).formatToParts(date);
                const get = (type) => parts.find((part) => part.type === type)?.value || '';
                return `${String(get('month')).toUpperCase()} ${Number(get('day'))}, ${get('year')} AT ${Number(get('hour'))}:${get('minute')}`;
            } catch {
                return value;
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/history', { cache: 'no-store' });
                if (!res.ok) return;
                renderHistory(await res.json());
            } catch {
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function subscribe() {
            try {
                if (hasSubscribed || !PUBLIC_VAPID_KEY) return;

                if (Notification.permission === 'default') {
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') return;
                }

                if (Notification.permission !== 'granted') return;

                const existingSubscription = typeof window.pushManager.getSubscription === 'function'
                    ? await window.pushManager.getSubscription()
                    : null;

                const subscription = existingSubscription || await window.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
                });

                await fetch('/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(subscription)
                });

                hasSubscribed = true;
                const button = document.getElementById('enable-notifications');
                if (button) button.style.display = 'none';
            } catch {
            }
        }

        window.addEventListener('load', async () => {
            const button = document.getElementById('enable-notifications');
            loadHistory();

            try {
                const res = await fetch('/config', { cache: 'no-store' });
                const config = await res.json();
                PUBLIC_VAPID_KEY = config.vapidPublicKey || '';
            } catch {
                return;
            }

            if (Notification.permission === 'default') {
                if (button) {
                    button.style.display = 'inline-block';
                    button.addEventListener('click', subscribe, { once: true });
                }
                return;
            }

            if (Notification.permission === 'granted') {
                if (typeof window.pushManager.getSubscription === 'function') {
                    const existingSubscription = await window.pushManager.getSubscription();
                    if (existingSubscription) {
                        hasSubscribed = true;
                        return;
                    }
                }
                subscribe();
            }
        });
    </script>
</body>

</html>
