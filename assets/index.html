<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Attention">
</head>
<body>
    <button id="enable-notifications" style="display:none;">Enable Notifications</button>
    <section id="history"></section>

<script>
    let hasSubscribed = false;
    let PUBLIC_VAPID_KEY = '';

    function renderHistory(data) {
        const root = document.getElementById('history');
        root.replaceChildren();
        if (!data || !data.ok || !Array.isArray(data.items) || data.items.length === 0) return;

        const grouped = new Map();
        for (const item of data.items) {
            if (!grouped.has(item.sourceKey)) {
                grouped.set(item.sourceKey, {
                    sourceLabel: item.sourceLabel || item.sourceKey,
                    items: []
                });
            }
            grouped.get(item.sourceKey).items.push(item);
        }

        for (const [, group] of grouped) {
            const section = document.createElement('section');

            for (const item of group.items) {
                const entry = document.createElement('article');
                entry.style.border = '1px solid';
                entry.style.margin = '0 0 12px 0';
                entry.style.padding = '10px';
                if (item.link) {
                    entry.style.cursor = 'pointer';
                    entry.addEventListener('click', () => {
                        window.location.href = item.link;
                    });
                }

                const layout = document.createElement('div');
                layout.style.display = 'flex';
                layout.style.alignItems = 'flex-start';
                layout.style.gap = '10px';

                const mediaSource = item.imageUrl || faviconFor(item.link);
                if (mediaSource) {
                    const mediaWrap = document.createElement('div');
                    mediaWrap.style.flex = '0 0 30%';
                    mediaWrap.style.display = 'flex';
                    mediaWrap.style.flexDirection = 'column';
                    mediaWrap.style.alignItems = 'stretch';

                    const image = document.createElement('img');
                    image.src = mediaSource;
                    image.alt = item.title || '';
                    image.style.width = item.imageUrl ? '100%' : '48px';
                    image.style.height = 'auto';
                    image.style.display = 'block';
                    mediaWrap.appendChild(image);

                    const mediaFooter = document.createElement('div');
                    mediaFooter.style.display = 'flex';
                    mediaFooter.style.justifyContent = 'space-between';
                    mediaFooter.style.alignItems = 'baseline';
                    mediaFooter.style.gap = '8px';
                    mediaFooter.style.fontFamily = 'sans-serif';
                    mediaFooter.style.marginTop = '8px';

                    const footerTitle = document.createElement('div');
                    const shouldRenderTitle = item.sourceKey !== 'wikipedia-potd' && item.title && item.title !== group.sourceLabel;
                    footerTitle.textContent = item.sourceKey === 'wikipedia-potd'
                        ? 'Wikipedia Picture of Today'
                        : (shouldRenderTitle ? (item.title || item.sourceLabel || 'Notification') : group.sourceLabel);
                    mediaFooter.appendChild(footerTitle);

                    if (item.publishedAt) {
                        const time = document.createElement('div');
                        time.textContent = formatChinaTime(item.publishedAt);
                        time.style.marginLeft = 'auto';
                        time.style.textAlign = 'right';
                        time.style.whiteSpace = 'nowrap';
                        mediaFooter.appendChild(time);
                    }

                    mediaWrap.appendChild(mediaFooter);
                    layout.appendChild(mediaWrap);
                }

                const content = document.createElement('div');
                content.style.flex = '1 1 auto';

                if (item.bodyHtml) {
                    const body = document.createElement('p');
                    body.style.margin = '0';
                    body.innerHTML = item.bodyHtml;
                    if (item.link) {
                        body.append(document.createTextNode(' '));
                        const inlineLink = document.createElement('a');
                        inlineLink.href = item.link;
                        inlineLink.target = '_blank';
                        inlineLink.rel = 'noreferrer';
                        inlineLink.textContent = '查看原文';
                        inlineLink.addEventListener('click', (event) => event.stopPropagation());
                        body.appendChild(inlineLink);
                    }
                    content.appendChild(body);
                } else if (item.body) {
                    const body = document.createElement('p');
                    body.style.margin = '0';
                    body.textContent = item.body;
                    if (item.link) {
                        body.append(document.createTextNode(' '));
                        const inlineLink = document.createElement('a');
                        inlineLink.href = item.link;
                        inlineLink.target = '_blank';
                        inlineLink.rel = 'noreferrer';
                        inlineLink.textContent = '查看原文';
                        inlineLink.addEventListener('click', (event) => event.stopPropagation());
                        body.appendChild(inlineLink);
                    }
                    content.appendChild(body);
                } else if (item.link) {
                    const link = document.createElement('a');
                    link.href = item.link;
                    link.target = '_blank';
                    link.rel = 'noreferrer';
                    link.textContent = '查看原文';
                    link.addEventListener('click', (event) => event.stopPropagation());
                    content.appendChild(link);
                }

                layout.appendChild(content);
                entry.appendChild(layout);
                section.appendChild(entry);
            }
            root.appendChild(section);
        }
    }

    function faviconFor(link) {
        try {
            if (!link) return '';
            const url = new URL(link);
            return `${url.origin}/favicon.ico`;
        } catch (err) {
            return '';
        }
    }

    function formatChinaTime(value) {
        try {
            const date = new Date(value);
            const parts = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Shanghai',
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: false
            }).formatToParts(date);
            const get = type => parts.find(part => part.type === type)?.value || '';
            return `${String(get('month')).toUpperCase()} ${Number(get('day'))}, ${get('year')} AT ${Number(get('hour'))}:${get('minute')}`;
        } catch (err) {
            return value;
        }
    }

    async function loadHistory() {
        try {
            const res = await fetch('/history', { cache: 'no-store' });
            if (!res.ok) throw new Error('failed');
            const data = await res.json();
            renderHistory(data);
        } catch (err) {
        }
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    }

    async function subscribe() {
        try {
            if (hasSubscribed) return;
            if (!PUBLIC_VAPID_KEY) return;

            if (Notification.permission === 'default') {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') return;
            }

            if (Notification.permission !== 'granted') return;

            const existingSubscription = typeof window.pushManager.getSubscription === 'function'
                ? await window.pushManager.getSubscription()
                : null;

            const subscription = existingSubscription || await window.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
            });

            await fetch('/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(subscription)
            });

            hasSubscribed = true;
            const button = document.getElementById('enable-notifications');
            if (button) button.style.display = 'none';

        } catch (err) {
        }
    }

    window.addEventListener('load', async () => {
        const button = document.getElementById('enable-notifications');
        loadHistory();
        try {
            const res = await fetch('/config', { cache: 'no-store' });
            const config = await res.json();
            PUBLIC_VAPID_KEY = config.vapidPublicKey || '';
        } catch (err) {
            return;
        }
        if (Notification.permission === 'default') {
            if (button) {
                button.style.display = 'inline-block';
                button.addEventListener('click', subscribe, { once: true });
            }
            return;
        }

        if (Notification.permission === 'granted') {
            if (typeof window.pushManager.getSubscription === 'function') {
                const existingSubscription = await window.pushManager.getSubscription();
                if (existingSubscription) {
                    hasSubscribed = true;
                    return;
                }
            }
            subscribe();
        }
    });
</script>
</body>

</html>
