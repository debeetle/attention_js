<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/figure/icon.png">
    <link rel="apple-touch-icon" href="/figure/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Attention">
    <style>
        #permission-grant {
            display: none;
            font-family: sans-serif;
            margin: 0;
            padding: 0.5rem;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            background-color: purple;
        }
        @font-face {
            font-family: 'SCP';
            src: url('font/SourceCodePro-VariableFont_wght.ttf');
        }
        @font-face {
            font-family: 'LM Math';
            src: url('font/latinmodern-math.otf');
        }
        @font-face {
            font-family: 'STZhongsong';
            src: url('font/STZHONGS.TTF');
        }

        html,
        body {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        .notification {
            margin: 1rem 0 1rem 0;
            padding: 12px;
            border: 1px solid;
            border-color: rgb(from currentColor r g b / 60%);
            border-radius: 18px;
        }
        
        a {
            text-decoration: none;
        }

        .article-text {
            font-family: "LM Math";
        }

        .no-image-header {
            display: grid;
            grid-template-columns: 1.5rem 1fr;
        }

        .favicon {
            width: 100%;
            height: auto;
        }

        .notification-meta {
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ccc;
        }

        :root {
            color-scheme: light dark;
        }

        /* Big image*/
        .picture {
            display: block;
            width: 100%;
            max-height: 22rem;
            object-fit: cover;
        }

        .picture-wrap {
            position: relative;
            border-radius: 6px;
            overflow: hidden;            
            border: 1px solid;
            border-color: rgb(from currentColor r g b / 20%);
        }

        .picture-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0.5rem;
            font-family: sans-serif;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            background: rgba(28, 24, 20, 0.05);
            -webkit-backdrop-filter: blur(0.2rem);
            backdrop-filter: blur(0.2rem);
        }

        .picture-source-logo {
            /* display: block; */
            width: auto;
            height: 1.5rem;
            /* flex: 0 0 auto; */
        }

        .on-this-day-paired {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 0.5rem;
            /* align-items: center; */
            /* margin-bottom: 0.75rem; */
        }

        .annotated-picture {
            display: block;
            width: auto;
            height: 12rem;
            /* max-width: 45vw; */
            /* object-fit: cover; */
            border-radius: 6px;            
            border: 1px solid;
            border-color: rgb(from currentColor r g b / 20%);
        }

        .on-this-day-heading {
            margin-top: 0;
        }

        /* wiki potd end */

        /* wiki onthisday start */
        ul {
            margin-top: 0;
            margin-bottom: 0;
            /* list-style-type: none; */
            padding-left: 1rem;
        }
        li::marker {
            font-family: "LM Math";
        }
        /* wiki onthisday end */

        @media (prefers-color-scheme: dark) {
            /* .notification {
                border-color: #5a5a5a;
            } */
            /* .picture-wrap {
                border-color: #282a36;
            } */
        } 

    </style>
</head>

<body>
    <div id="permission-grant">register</div>
    <div id="history"></div>

    <script>
        const HISTORY_DB_NAME = 'attention-history';
        const HISTORY_DB_VERSION = 1;
        const HISTORY_STORE_NAME = 'articles';
        const HISTORY_RENDER_LIMIT = 50;
        let hasSubscribed = false;
        let PUBLIC_VAPID_KEY = '';

        function transactionDone(transaction) {
            return new Promise((resolve, reject) => {
                transaction.oncomplete = () => resolve();
                transaction.onerror = () => reject(transaction.error || new Error('IndexedDB transaction failed'));
                transaction.onabort = () => reject(transaction.error || new Error('IndexedDB transaction aborted'));
            });
        }

        function openHistoryDb() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(HISTORY_DB_NAME, HISTORY_DB_VERSION);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    const store = db.objectStoreNames.contains(HISTORY_STORE_NAME)
                        ? request.transaction.objectStore(HISTORY_STORE_NAME)
                        : db.createObjectStore(HISTORY_STORE_NAME, { keyPath: 'id' });

                    if (!store.indexNames.contains('createdAt')) {
                        store.createIndex('createdAt', 'createdAt');
                    }
                    if (!store.indexNames.contains('publishedAt')) {
                        store.createIndex('publishedAt', 'publishedAt');
                    }
                    if (!store.indexNames.contains('sourceKey')) {
                        store.createIndex('sourceKey', 'sourceKey');
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error || new Error('Unable to open IndexedDB'));
            });
        }

        async function readHistoryFromDb(limit = HISTORY_RENDER_LIMIT) {
            const db = await openHistoryDb();
            try {
                const transaction = db.transaction(HISTORY_STORE_NAME, 'readonly');
                const index = transaction.objectStore(HISTORY_STORE_NAME).index('createdAt');
                const items = [];
                await new Promise((resolve, reject) => {
                    const request = index.openCursor(null, 'prev');
                    request.onsuccess = () => {
                        const cursor = request.result;
                        if (!cursor || items.length >= limit) {
                            resolve();
                            return;
                        }
                        items.push(cursor.value);
                        cursor.continue();
                    };
                    request.onerror = () => reject(request.error || new Error('Unable to read local history'));
                });
                return items;
            } finally {
                db.close();
            }
        }

        async function replaceHistoryInDb(items) {
            const db = await openHistoryDb();
            try {
                const transaction = db.transaction(HISTORY_STORE_NAME, 'readwrite');
                const store = transaction.objectStore(HISTORY_STORE_NAME);
                store.clear();
                for (const item of items) {
                    store.put(item);
                }
                await transactionDone(transaction);
            } finally {
                db.close();
            }
        }

        function renderHistory(items) {
            const root = document.getElementById('history');
            root.replaceChildren();
            if (!Array.isArray(items)) return;

            const fragment = document.createDocumentFragment();
            for (const [index, item] of items.entries()) {
                fragment.appendChild(buildNotification(item, index));
            }
            root.appendChild(fragment);
        }

        function isWikipediaSource(item) {
            return ['picture of today', 'on this day', 'do you know'].includes((item.sourceKey || '').toLowerCase());
        }

        function isOnThisDaySource(item) {
            return (item.sourceKey || '').toLowerCase() === 'on this day';
        }

        function appendSourceHeader(parent, item) {
            const header = document.createElement('div');
            header.className = 'no-image-header';

            const logo = document.createElement('div');
            const iconSrc = sourceIconFor(item);
            if (iconSrc) {
                const favicon = document.createElement('img');
                favicon.className = 'favicon';
                favicon.src = iconSrc;
                favicon.alt = item.sourceKey || '';
                favicon.decoding = 'async';
                favicon.loading = 'lazy';
                favicon.fetchPriority = 'low';
                logo.appendChild(favicon);
            }
            header.appendChild(logo);

            const title = document.createElement('div');
            title.style.paddingLeft = "1rem";
            title.textContent = item.title || '';
            header.appendChild(title);
            parent.appendChild(header);
        }

        function buildNotification(item, index) {
            const notification = document.createElement('article');
            notification.className = 'notification';

            if (item.link) {
                notification.addEventListener('click', () => {
                    window.location.assign(item.link);
                });
            }

            if (item.imageUrl && !isOnThisDaySource(item)) {
                const pictureWrap = document.createElement('div');
                pictureWrap.className = 'picture-wrap';

                const picture = document.createElement('img');
                picture.className = 'picture';
                picture.src = item.imageUrl;
                picture.alt = item.imageAlt || '';
                picture.decoding = 'async';
                picture.loading = index === 0 ? 'eager' : 'lazy';
                picture.fetchPriority = index === 0 ? 'high' : 'low';
                pictureWrap.appendChild(picture);

                const overlay = document.createElement('div');
                overlay.className = 'picture-overlay';

                if (item.imageAlt) {
                    const title = document.createElement('div');
                    title.className = 'picture-title';
                    title.textContent = item.imageAlt;
                    overlay.appendChild(title);
                }

                if (isWikipediaSource(item)) {
                    const logo = document.createElement('img');
                    logo.className = 'picture-source-logo';
                    logo.src = '/figure/Wikipedia-logo-v2.svg';
                    logo.alt = 'Wikipedia';
                    logo.decoding = 'async';
                    overlay.appendChild(logo);
                }

                pictureWrap.appendChild(overlay);

                notification.appendChild(pictureWrap);

                appendBody(notification, item);
                appendMetaRow(notification, item);
                return notification;
            }

            if (isOnThisDaySource(item)) {
                appendOnThisDayBody(notification, item);
                appendMetaRow(notification, item);
                return notification;
            }

            appendSourceHeader(notification, item);
            appendBody(notification, item);
            appendMetaRow(notification, item);
            return notification;
        }

        function appendMetaRow(parent, item) {
            const row = document.createElement('div');
            row.className = 'notification-meta';
            row.textContent = item.sourceKey + ' ' + elapsedHoursText(item.publishedAt);

            parent.appendChild(row);
        }

        function appendBody(parent, item) {
            if (isOnThisDaySource(item)) {
                appendOnThisDayBody(parent, item);
                return;
            }

            const articleText = document.createElement('div');
            articleText.className = 'article-text';
            if (item.lang) {
                articleText.style.fontFamily = "STZhongsong";
            }
            if (item.summaryHtml) {
                articleText.innerHTML = item.summaryHtml;
            }

            parent.appendChild(articleText);
        }

        function appendOnThisDayBody(parent, item) {
            const articleText = document.createElement('div');
            articleText.className = 'article-text';

            const template = document.createElement('template');
            template.innerHTML = item.summaryHtml || '';

            const heading = template.content.querySelector('p');
            const allEntries = Array.from(template.content.querySelectorAll('li'));

            if (heading || isWikipediaSource(item)) {
                const header = document.createElement('div');
                header.className = 'no-image-header';

                const logoWrap = document.createElement('div');
                if (isWikipediaSource(item)) {
                    const logo = document.createElement('img');
                    logo.className = 'favicon';
                    logo.src = '/figure/Wikipedia-logo-v2.svg';
                    logo.alt = 'Wikipedia';
                    logo.decoding = 'async';
                    logo.loading = 'lazy';
                    logo.fetchPriority = 'low';
                    logoWrap.appendChild(logo);
                }
                header.appendChild(logoWrap);

                const headingWrap = document.createElement('div');
                headingWrap.style.paddingLeft = '1rem';
                if (heading) {
                    const headingNode = heading.cloneNode(true);
                    headingNode.classList.add('on-this-day-heading');
                    headingWrap.appendChild(headingNode);
                }
                header.appendChild(headingWrap);

                articleText.appendChild(header);
            }

            if (allEntries.length) {
                const entries = selectOnThisDayEntries(allEntries, findPicturedIndex(allEntries));
                const list = document.createElement('ul');
                for (const entry of entries) {
                    list.appendChild(buildOnThisDayEntry(entry, item));
                }
                articleText.appendChild(list);
            }

            if (!heading && !allEntries.length && item.summaryHtml) {
                articleText.innerHTML = item.summaryHtml;
            }

            parent.appendChild(articleText);
        }

        function findPicturedIndex(entries) {
            return entries.findIndex((entry) => /\((pictured|depicted)\)/i.test(entry.textContent || ''));
        }

        function selectOnThisDayEntries(entries, picturedIndex) {
            if (picturedIndex >= 0 && picturedIndex > 2) {
                const indexes = [0, 1, picturedIndex];
                return indexes.filter((i) => i < entries.length).map((i) => entries[i]);
            }
            return entries.slice(0, 3);
        }

        function buildOnThisDayEntry(entry, item) {
            const cleanEntry = entry.cloneNode(true);
            cleanEntry.querySelectorAll('img, .annotated-picture, .on-this-day-paired-image').forEach((node) => node.remove());
            cleanEntry.querySelectorAll('.on-this-day-paired, .on-this-day-paired-text').forEach(unwrapElement);

            const li = document.createElement('li');
            if (/\((pictured|depicted)\)/i.test(cleanEntry.textContent || '') && item.imageUrl) {
                const row = document.createElement('div');
                row.className = 'on-this-day-paired';

                const text = document.createElement('div');
                text.className = 'article-text';
                moveChildren(cleanEntry, text);

                const image = document.createElement('img');
                image.className = 'annotated-picture';
                image.src = item.imageUrl;
                image.alt = '';
                image.decoding = 'async';
                image.loading = 'lazy';
                image.fetchPriority = 'low';

                row.append(text, image);
                li.appendChild(row);
                return li;
            }

            moveChildren(cleanEntry, li);
            return li;
        }

        function moveChildren(from, to) {
            while (from.firstChild) {
                to.appendChild(from.firstChild);
            }
        }

        function unwrapElement(element) {
            const parent = element.parentNode;
            if (!parent) return;
            while (element.firstChild) {
                parent.insertBefore(element.firstChild, element);
            }
            parent.removeChild(element);
        }

        function sourceIconFor(item) {
            if (isWikipediaSource(item)) {
                return '/figure/Wikipedia-logo-v2.svg';
            }
            return '';
        }

        function elapsedHoursText(value) {
            const publishedAt = Date.parse(value || '');
            if (!Number.isFinite(publishedAt)) return '';
            const hours = Math.max(0, Math.floor((Date.now() - publishedAt) / (60 * 60 * 1000)));
            return `${hours}h`;
            // return `${hours} ${hours === 1 ? 'hour' : 'hours'}`;
        }

        async function renderLocalHistory() {
            try {
                renderHistory(await readHistoryFromDb());
            } catch {
            }
        }

        async function syncHistory() {
            try {
                const res = await fetch('/history', { cache: 'no-store' });
                if (!res.ok) return;
                const payload = await res.json();
                if (!payload || !payload.ok || !Array.isArray(payload.items)) return;
                await replaceHistoryInDb(payload.items);
                renderHistory(payload.items);
            } catch {
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function subscribe() {
            try {
                if (hasSubscribed || !PUBLIC_VAPID_KEY) return;

                if (Notification.permission === 'default') {
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') return;
                }

                if (Notification.permission !== 'granted') return;

                const existingSubscription = typeof window.pushManager.getSubscription === 'function'
                    ? await window.pushManager.getSubscription()
                    : null;

                const subscription = existingSubscription || await window.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
                });

                await fetch('/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(subscription)
                });

                hasSubscribed = true;
                const button = document.getElementById('permission-grant');
                if (button) button.style.display = 'none';
            } catch {
            }
        }

        window.addEventListener('load', async () => {
            const button = document.getElementById('permission-grant');
            renderLocalHistory();
            syncHistory();

            try {
                const res = await fetch('/config', { cache: 'no-store' });
                const config = await res.json();
                PUBLIC_VAPID_KEY = config.vapidPublicKey || '';
            } catch {
                return;
            }

            if (Notification.permission === 'default') {
                if (button) {
                    button.style.display = 'inline-block';
                    button.addEventListener('click', subscribe, { once: true });
                }
                return;
            }

            if (Notification.permission === 'granted') {
                if (typeof window.pushManager.getSubscription === 'function') {
                    const existingSubscription = await window.pushManager.getSubscription();
                    if (existingSubscription) {
                        hasSubscribed = true;
                        return;
                    }
                }
                subscribe();
            }
        });
    </script>
    
</body>

</html>
