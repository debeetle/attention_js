<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/figure/icon.png">
    <link rel="apple-touch-icon" href="/figure/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Attention">
    <style>
        #permission-grant {
            display: none;
        }
        @font-face {
            font-family: 'SCP';
            src: url('font/SourceCodePro-VariableFont_wght.ttf');
        }
        @font-face {
            font-family: 'LM Math';
            src: url('font/latinmodern-math.otf');
        }
        @font-face {
            font-family: 'STZhongsong';
            src: url('font/STZHONGS.TTF');
        }

        html,
        body {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .notification {
            margin: 1rem 0 1rem 0;
            padding: 8px;
            border: 2px solid;
            border-color: rgb(from currentColor r g b / 60%);
            border-radius: 15px;
        }
        
        a {
            text-decoration: none;
        }

        .article-text {
            font-family: "LM Math";
        }

        .no-image-header {
            display: grid;
            grid-template-columns: 10% 1fr;
            font-family: "STZhongsong";
        }

        .favicon {
            width: 100%;
            height: auto;
        }

        .notification-meta {
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ccc;
        }

        :root {
            color-scheme: light dark;
        }

        /* Big image*/
        .picture {
            display: block;
            max-width: 100%;
            height: auto;
            width: 100%;
        }

        .picture-wrap {
            position: relative;
            overflow: hidden;
            border-radius: 7px;
            border: 1px solid;
            border-color: rgb(from currentColor r g b / 20%);
        }

        .picture-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0.5rem;
            font-family: sans-serif;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            background: rgba(28, 24, 20, 0.2);
            -webkit-backdrop-filter: blur(1rem);
            backdrop-filter: blur(1rem);
        }

        .picture-source-logo {
            /* display: block; */
            width: auto;
            height: 1.5rem;
            /* flex: 0 0 auto; */
        }

        /* wiki potd end */

        /* wiki onthisday start */
        ul {
            margin-top: 0;
            list-style-type: none;
            padding-left: 0;
        }
        /* wiki onthisday end */

        @media (prefers-color-scheme: dark) {
            /* .notification {
                border-color: #5a5a5a;
            } */
            /* .picture-wrap {
                border-color: #282a36;
            } */
        } 

    </style>
</head>

<body>
    <button id="permission-grant">Enable Notifications</button>
    <section id="history"></section>

    <script>
        let hasSubscribed = false;
        let PUBLIC_VAPID_KEY = '';

        function renderHistory(payload) {
            const root = document.getElementById('history');
            root.replaceChildren();
            if (!payload || !payload.ok || !Array.isArray(payload.items)) return;

            const fragment = document.createDocumentFragment();
            for (const [index, item] of payload.items.entries()) {
                fragment.appendChild(buildNotification(item, index));
            }
            root.appendChild(fragment);
        }

        function buildNotification(item, index) {
            const notification = document.createElement('article');
            notification.className = `notification${item.imageUrl ? '' : ' no-image'}`;

            if (item.link) {
                notification.addEventListener('click', () => {
                    window.location.assign(item.link);
                });
            }

            if (item.imageUrl) {
                const pictureWrap = document.createElement('div');
                pictureWrap.className = 'picture-wrap';

                const picture = document.createElement('img');
                picture.className = 'picture';
                picture.src = item.imageUrl;
                picture.alt = item.imageAlt || '';
                picture.decoding = 'async';
                picture.loading = index === 0 ? 'eager' : 'lazy';
                picture.fetchPriority = index === 0 ? 'high' : 'low';
                pictureWrap.appendChild(picture);

                const overlay = document.createElement('div');
                overlay.className = 'picture-overlay';

                if (item.imageAlt) {
                    const title = document.createElement('div');
                    title.className = 'picture-title';
                    title.textContent = item.imageAlt;
                    overlay.appendChild(title);
                }

                if (item.sourceKey === 'WikiPOTD' || item.sourceKey === 'WikiOnThisDay') {
                    const logo = document.createElement('img');
                    logo.className = 'picture-source-logo';
                    logo.src = '/figure/Wikipedia-logo-v2.svg';
                    logo.alt = 'Wikipedia';
                    logo.decoding = 'async';
                    overlay.appendChild(logo);
                }

                pictureWrap.appendChild(overlay);

                notification.appendChild(pictureWrap);

                appendBody(notification, item);
                appendMetaRow(notification, item);
                return notification;
            }

            const header = document.createElement('div');
            header.className = 'no-image-header';

            const logo = document.createElement('div');
            const favicon = document.createElement('img');
            favicon.className = 'favicon';
            favicon.src = sourceIconFor(item);
            favicon.alt = item.sourceKey || '';
            favicon.decoding = 'async';
            favicon.loading = 'lazy';
            favicon.fetchPriority = 'low';
            logo.appendChild(favicon);
            header.appendChild(logo);

            const title = document.createElement('div');
            title.style.paddingLeft = "1rem";
            title.textContent = item.title || '';
            header.appendChild(title);

            notification.appendChild(header);
            appendBody(notification, item);
            appendMetaRow(notification, item);
            return notification;
        }

        function appendMetaRow(parent, item) {
            const row = document.createElement('div');
            row.className = 'notification-meta';
            row.textContent = item.sourceKey + ' ' + elapsedHoursText(item.publishedAt);

            parent.appendChild(row);
        }

        function appendBody(parent, item) {
            const articleText = document.createElement('div');
            articleText.className = 'article-text';
            if (item.lang) {
                articleText.style.fontFamily = "STZhongsong";
            }
            if (item.summaryHtml) {
                articleText.innerHTML = item.summaryHtml;
            }

            parent.appendChild(articleText);
        }

        function faviconFor(link) {
            try {
                if (!link) return '/icon.png';
                const url = new URL(link);
                return `${url.origin}/favicon.ico`;
            } catch {
                return '/icon.png';
            }
        }

        function sourceIconFor(item) {
            if ((item.sourceKey || '').startsWith('Wiki')) {
                return '/figure/Wikipedia-logo-v2.svg';
            }
            return faviconFor(item.link);
        }

        function elapsedHoursText(value) {
            const publishedAt = Date.parse(value || '');
            if (!Number.isFinite(publishedAt)) return '';
            const hours = Math.max(0, Math.floor((Date.now() - publishedAt) / (60 * 60 * 1000)));
            return `${hours} ${hours === 1 ? 'hour' : 'hours'}`;
        }

        async function loadHistory() {
            try {
                const res = await fetch('/history', { cache: 'no-store' });
                if (!res.ok) return;
                renderHistory(await res.json());
            } catch {
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function subscribe() {
            try {
                if (hasSubscribed || !PUBLIC_VAPID_KEY) return;

                if (Notification.permission === 'default') {
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') return;
                }

                if (Notification.permission !== 'granted') return;

                const existingSubscription = typeof window.pushManager.getSubscription === 'function'
                    ? await window.pushManager.getSubscription()
                    : null;

                const subscription = existingSubscription || await window.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
                });

                await fetch('/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(subscription)
                });

                hasSubscribed = true;
                const button = document.getElementById('permission-grant');
                if (button) button.style.display = 'none';
            } catch {
            }
        }

        window.addEventListener('load', async () => {
            const button = document.getElementById('permission-grant');
            loadHistory();

            try {
                const res = await fetch('/config', { cache: 'no-store' });
                const config = await res.json();
                PUBLIC_VAPID_KEY = config.vapidPublicKey || '';
            } catch {
                return;
            }

            if (Notification.permission === 'default') {
                if (button) {
                    button.style.display = 'inline-block';
                    button.addEventListener('click', subscribe, { once: true });
                }
                return;
            }

            if (Notification.permission === 'granted') {
                if (typeof window.pushManager.getSubscription === 'function') {
                    const existingSubscription = await window.pushManager.getSubscription();
                    if (existingSubscription) {
                        hasSubscribed = true;
                        return;
                    }
                }
                subscribe();
            }
        });
    </script>
    
</body>

</html>
