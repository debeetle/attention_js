<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/figure/icon.png">
    <link rel="apple-touch-icon" href="/figure/icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Attention">
    <style>
        #permission-grant {
            display: none;
            font-family: sans-serif;
            padding: 0.5rem;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            background-color: purple;
        }

        @font-face {
            font-family: 'Universal';
            src: url('font/latinmodern-math.otf');
            unicode-range: U+0000-007F, U+0080-00FF;
        }

        @font-face {
            font-family: 'Universal';
            src: url('font/STZHONGS.TTF');
            unicode-range: U+4E00-9FFF;
        }

        html,
        body {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            font-family: 'Universal';
            touch-action: manipulation;
            /* margin: 0; */
        }

        :root {
            color-scheme: light dark;
            --main-borderadius: 18px;
            --main-pad: 12px;
        }

        .notification {
            margin: 1rem 0 1rem 0;
            padding: var(--main-pad);
            border: 1px solid;
            border-color: rgb(from currentColor r g b / 60%);
            border-radius: var(--main-borderadius);
            overflow-wrap: anywhere;
            max-width: 30rem;
        }

        a {
            text-decoration: none;
        }

        .favicon {
            display: block;
            width: auto;
            height: 1.5rem;
        }

        .notification-meta {
            font-family: sans-serif;
            font-size: 0.8rem;
            font-weight: bold;
            color: #ccc;
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-top: 0.5rem;
        }



        .picture {
            display: block;
            width: 100%;
            max-height: 20rem;
            object-fit: cover;
            background: white;
        }

        .picture-wrap {
            position: relative;
            border-radius: calc(var(--main-borderadius) - var(--main-pad));
            overflow: hidden;
            border: 1px solid;
            border-color: rgb(from currentColor r g b / 20%);
        }

        .picture-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0.5rem;
            color: white;
            font-size: 0.8rem;
            background-color: rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(1rem);
            backdrop-filter: blur(1rem);
            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.6),
                inset 0 0.5rem 1rem rgba(3, 7, 18, 0.2),
                0px 0px 0px rgba(3, 7, 18, 0.10),
                0px 0px 1px rgba(3, 7, 18, 0.08),
                0px 0px 2px rgba(3, 7, 18, 0.06),
                0px 0px 3px rgba(3, 7, 18, 0.04),
                0px 0px 4px rgba(3, 7, 18, 0.02);
        }

        .annotated-picture-list {
            display: grid;
            grid-template-columns: auto 45%;
            gap: 0.5rem;
        }

        .annotated-picture {
            display: block;
            max-width: 100%;
            border-radius: 6px;
            border: 1px solid;
            border-color: rgb(from currentColor r g b / 20%);
        }

        .otd-p-heading {
            margin-top: 0;
            margin-bottom: 0;
        }

        ul {
            padding-left: 1rem;
        }

        /* wiki onthisday end */

        nav {
            touch-action: none;
            position: fixed;
            bottom: env(safe-area-inset-bottom, 0px);
            left: 22px;
            height: 3.5rem;
            width: 3.5rem;
            align-items: center;
            justify-content: center;
            z-index: 1;
            border-color: none;
            border-radius: 50%;
            background-color: rgba(250, 250, 250, 0.05);
            backdrop-filter: blur(0.2rem);
            box-shadow:
                inset 0 1px 2px white,
                inset 0 5px 10px rgba(3, 7, 18, 0.1),
                inset 0 -5px 10px rgba(255, 255, 255, 0.1),
                inset 0 -1px 2px white,
                0px 0px 0px rgb(from currentColor calc(3 - r*3/255) calc(7 - g*7/255) calc(18 - b*18/255) / 10%),
                0px 1px 2px rgb(from currentColor calc(3 - r*3/255) calc(7 - g*7/255) calc(18 - b*18/255) / 8%),
                0px 2px 4px rgb(from currentColor calc(3 - r*3/255) calc(7 - g*7/255) calc(18 - b*18/255) / 6%),
                0px 3px 6px rgb(from currentColor calc(3 - r*3/255) calc(7 - g*7/255) calc(18 - b*18/255) / 4%),
                0px 4px 8px rgb(from currentColor calc(3 - r*3/255) calc(7 - g*7/255) calc(18 - b*18/255) / 2%);
            transition: 
                width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2),
                height 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2),
                border-radius 0.2s ease,
                background-color 0.2s ease;
        }

        nav.open {
            height: 16rem;
            width: 12rem;
            align-items: center;
            justify-content: center;
            border-radius: var(--main-borderadius);
            padding: 8px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(1.5rem);
            box-shadow:
                inset 0 1px 2px white,
                inset 0 5px 10px rgba(3, 7, 18, 0.1),
                inset 0 -5px 10px rgba(255, 255, 255, 0.1),
                inset 0 -1px 2px white,
                0px 0px 0px rgb(from currentColor calc(3 - r*3/255) calc(7 - g*7/255) calc(18 - b*18/255) / 10%),
                0px 1px 2px rgb(from currentColor calc(3 - r*3/255) calc(7 - g*7/255) calc(18 - b*18/255) / 8%),
                0px 2px 4px rgb(from currentColor calc(3 - r*3/255) calc(7 - g*7/255) calc(18 - b*18/255) / 6%),
                0px 3px 6px rgb(from currentColor calc(3 - r*3/255) calc(7 - g*7/255) calc(18 - b*18/255) / 4%),
                0px 4px 8px rgb(from currentColor calc(3 - r*3/255) calc(7 - g*7/255) calc(18 - b*18/255) / 2%);
        }

        nav li {
            visibility: hidden;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem;
            list-style: none;
            background: none;
            font-family: sans-serif;
            font-weight: bold;
            border-radius: calc(var(--main-borderadius) - 8px);
            /* cursor: pointer; */
            transition: 
            background 0.1s ease;
        }

        nav.open li {
            visibility: visible;
        }

        nav li img {
            width: 1.5rem;
            height: 1.5rem;
        }

        nav li.selected {
            background: rgba(0, 0, 0, 0.3);
            /* color: blue; */
        }

    </style>
</head>

<body>
    <div id="permission-grant"></div>
    <nav></nav>
    <div id="history"></div>

    <script>
        const HISTORY_DB_NAME = 'attention';
        const HISTORY_DB_VERSION = 1;
        const HISTORY_STORE_NAME = 'news';
        const HISTORY_RENDER_LIMIT = 100;
        const SOURCE_META = {
            'picture of the day': { logo: '/figure/Wikipedia-logo-v2.svg' },
            'on this day': { logo: '/figure/Wikipedia-logo-v2.svg' },
            'do you know': { logo: '/figure/Wikipedia-logo-v2.svg' },
            'sspai': { logo: '/figure/sspai_400x400.png' },
            'ithome': { logo: '/figure/IThome_logo.png' }
        };
        let hasSubscribed = false;
        let PUBLIC_VAPID_KEY = '';
        let activeSource = '';
        let allItems = [];

        function transactionDone(transaction) {
            return new Promise((resolve, reject) => {
                transaction.oncomplete = () => resolve();
                transaction.onerror = () => reject(transaction.error || new Error('IndexedDB transaction failed'));
                transaction.onabort = () => reject(transaction.error || new Error('IndexedDB transaction aborted'));
            });
        }

        function openHistoryDb() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(HISTORY_DB_NAME, HISTORY_DB_VERSION);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    const store = db.objectStoreNames.contains(HISTORY_STORE_NAME)
                        ? request.transaction.objectStore(HISTORY_STORE_NAME)
                        : db.createObjectStore(HISTORY_STORE_NAME, { keyPath: 'id' });

                    if (!store.indexNames.contains('createdAt')) {
                        store.createIndex('createdAt', 'createdAt');
                    }
                    if (!store.indexNames.contains('publishedAt')) {
                        store.createIndex('publishedAt', 'publishedAt');
                    }
                    if (!store.indexNames.contains('sourceKey')) {
                        store.createIndex('sourceKey', 'sourceKey');
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error || new Error('Unable to open IndexedDB'));
            });
        }

        async function readHistoryFromDb(limit = HISTORY_RENDER_LIMIT) {
            const db = await openHistoryDb();
            try {
                const transaction = db.transaction(HISTORY_STORE_NAME, 'readonly');
                const index = transaction.objectStore(HISTORY_STORE_NAME).index('createdAt');
                const items = [];
                await new Promise((resolve, reject) => {
                    const request = index.openCursor(null, 'prev');
                    request.onsuccess = () => {
                        const cursor = request.result;
                        if (!cursor || items.length >= limit) {
                            resolve();
                            return;
                        }
                        items.push(cursor.value);
                        cursor.continue();
                    };
                    request.onerror = () => reject(request.error || new Error('Unable to read local history'));
                });
                return items;
            } finally {
                db.close();
            }
        }

        async function replaceHistoryInDb(items) {
            const db = await openHistoryDb();
            try {
                const transaction = db.transaction(HISTORY_STORE_NAME, 'readwrite');
                const store = transaction.objectStore(HISTORY_STORE_NAME);
                store.clear();
                for (const item of items) {
                    store.put(item);
                }
                await transactionDone(transaction);
            } finally {
                db.close();
            }
        }

        function renderHistory(items) {
            allItems = items;
            if (activeSource) items = items.filter(it => (it.sourceKey || '').toLowerCase() === activeSource);
            const root = document.getElementById('history');
            root.replaceChildren();
            if (!Array.isArray(items)) return;

            const fragment = document.createDocumentFragment();
            for (const [index, item] of items.entries()) {
                fragment.appendChild(buildNotification(item, index));
            }
            root.appendChild(fragment);
        }

        function appendSourceHeader(parent, item) {

            const title = document.createElement('div');
            title.textContent = item.title || '';
            parent.appendChild(title);
        }

        function buildNotification(item, index) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            const isOnThisDay = (item.sourceKey || '').toLowerCase() === 'on this day';
            const isIthome = (item.sourceKey || '').toLowerCase() === 'ithome';
            const isPotd = (item.sourceKey || '').toLowerCase() === 'picture of the day';

            if (item.imageUrl && !isOnThisDay && !isIthome) {
                const pictureWrap = document.createElement('div');
                pictureWrap.className = 'picture-wrap';

                const picture = document.createElement('img');
                picture.className = 'picture';
                picture.src = item.imageUrl;
                picture.alt = item.imageAlt || '';
                picture.decoding = 'async';
                picture.loading = index === 0 ? 'eager' : 'lazy';
                picture.fetchPriority = index === 0 ? 'high' : 'low';
                pictureWrap.appendChild(picture);

                const overlay = document.createElement('div');
                overlay.className = 'picture-overlay';

                if (isPotd && item.summaryHtml) {
                    const d = document.createElement('div');
                    d.innerHTML = item.summaryHtml;
                    const t = (d.textContent || '').trim();
                    const i = t.search(/[.!?。！？]/);
                    const first = i >= 0 ? t.slice(0, i + 1) : t;
                    if (first) {
                        const title = document.createElement('div');
                        title.textContent = first;
                        overlay.appendChild(title);
                    }
                }

                pictureWrap.appendChild(overlay);

                notification.appendChild(pictureWrap);

                if (!isPotd) appendBody(notification, item);
                appendMetaRow(notification, item);
                return notification;
            }

            if (isOnThisDay) {
                appendOnThisDayBody(notification, item);
                appendMetaRow(notification, item);
                return notification;
            }

            appendSourceHeader(notification, item);
            appendBody(notification, item);
            appendMetaRow(notification, item);
            return notification;
        }

        function appendMetaRow(parent, item) {
            const row = document.createElement('div');
            row.className = 'notification-meta';
            const sourceMeta = SOURCE_META[(item.sourceKey || '').toLowerCase()] || {};

            const source = document.createElement('div');
            source.className = 'notification-meta-source';
            source.textContent = (item.sourceKey || '') + ' ' + elapsedHoursText(item.publishedAt);
            row.appendChild(source);

            if (item.link && sourceMeta.logo) {
                const more = document.createElement('a');
                more.href = item.link;
                const logo = document.createElement('img');
                logo.className = 'favicon';
                logo.src = sourceMeta.logo;
                logo.alt = item.sourceKey || '';
                logo.decoding = 'async';
                logo.loading = 'lazy';
                logo.fetchPriority = 'low';
                more.appendChild(logo);
                row.appendChild(more);
            }

            parent.appendChild(row);
        }

        function appendBody(parent, item) {
            if ((item.sourceKey || '').toLowerCase() === 'on this day') {
                appendOnThisDayBody(parent, item);
                return;
            }
            if ((item.sourceKey || '').toLowerCase() === 'ithome') return;
            if (!item.summaryHtml) return;

            const articleText = document.createElement('div');
            if (item.summaryHtml) {
                articleText.innerHTML = item.summaryHtml;
            }

            parent.appendChild(articleText);
        }

        function appendOnThisDayBody(parent, item) {
            const articleText = document.createElement('div');

            const wrapper = document.createElement('div');
            wrapper.innerHTML = item.summaryHtml || '';

            const heading = wrapper.querySelector('p');
            const allEntries = Array.from(wrapper.querySelectorAll('li'));

            heading.style.marginTop = '0';
            articleText.appendChild(heading);

            if (allEntries.length) {
                const entries = selectOnThisDayEntries(allEntries, findPicturedIndex(allEntries));
                if (entries.length === 1) {
                    moveChildren(buildOnThisDayEntry(entries[0], item), articleText);
                } else {
                    const list = document.createElement('ul');
                    for (const entry of entries) {
                        list.appendChild(buildOnThisDayEntry(entry, item));
                    }
                    articleText.appendChild(list);
                }
            }

            if (!heading && !allEntries.length && item.summaryHtml) {
                articleText.innerHTML = item.summaryHtml;
            }

            parent.appendChild(articleText);
        }

        function findPicturedIndex(entries) {
            return entries.findIndex((entry) => /\((pictured|depicted)\)/i.test(entry.textContent || ''));
        }

        function selectOnThisDayEntries(entries, picturedIndex) {
            if (picturedIndex >= 0) return [entries[picturedIndex]];
            return entries.slice(0, 3);
        }

        function buildOnThisDayEntry(entry, item) {
            const cleanEntry = entry.cloneNode(true);
            cleanEntry.querySelectorAll('img, .annotated-picture').forEach((node) => node.remove());
            cleanEntry.querySelectorAll('.annotated-picture-list').forEach(unwrapElement);

            const li = document.createElement('li');
            if (/\((pictured|depicted)\)/i.test(cleanEntry.textContent || '') && item.imageUrl) {
                const row = document.createElement('div');
                row.className = 'annotated-picture-list';

                const text = document.createElement('div');
                moveChildren(cleanEntry, text);

                const image = document.createElement('img');
                image.className = 'annotated-picture';
                image.src = item.imageUrl;
                image.alt = '';
                image.decoding = 'async';
                image.loading = 'lazy';
                image.fetchPriority = 'low';

                row.append(text, image);
                li.appendChild(row);
                return li;
            }

            moveChildren(cleanEntry, li);
            return li;
        }

        function moveChildren(from, to) {
            while (from.firstChild) {
                to.appendChild(from.firstChild);
            }
        }

        function unwrapElement(element) {
            const parent = element.parentNode;
            if (!parent) return;
            while (element.firstChild) {
                parent.insertBefore(element.firstChild, element);
            }
            parent.removeChild(element);
        }

        function elapsedHoursText(value) {
            const publishedAt = Date.parse(value || '');
            if (!Number.isFinite(publishedAt)) return '';
            const hours = Math.max(0, Math.floor((Date.now() - publishedAt) / (60 * 60 * 1000)));
            return `${hours}h`;
        }

        async function renderLocalHistory() {
            try {
                renderHistory(await readHistoryFromDb());
            } catch {
            }
        }

        async function syncHistory() {
            try {
                const res = await fetch('/history', { cache: 'no-store' });
                if (!res.ok) return;
                const payload = await res.json();
                if (!payload || !payload.ok || !Array.isArray(payload.items)) return;
                await replaceHistoryInDb(payload.items);
                renderHistory(payload.items);
            } catch {
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function subscribe() {
            try {
                if (hasSubscribed || !PUBLIC_VAPID_KEY) return;

                if (Notification.permission === 'default') {
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') return;
                }

                if (Notification.permission !== 'granted') return;

                const existingSubscription = window.pushManager && typeof window.pushManager.getSubscription === 'function'
                    ? await window.pushManager.getSubscription()
                    : null;

                const subscription = existingSubscription || await window.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
                });

                await fetch('/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(subscription)
                });

                hasSubscribed = true;
                const button = document.getElementById('permission-grant');
                if (button) button.style.display = 'none';
            } catch {
            }
        }

        window.addEventListener('load', async () => {
            const button = document.getElementById('permission-grant');

            // Build source picker from SOURCE_META
            const nav = document.querySelector('nav');

            const entries = [{ key: '', label: 'All', logo: null },
                ...Object.entries(SOURCE_META).map(([sk, m]) => ({ key: sk, label: sk, logo: m.logo }))];
            for (const { key, label, logo } of entries) {
                const li = document.createElement('li');
                li.dataset.key = key;
                if (logo) { const img = document.createElement('img'); img.src = logo; li.appendChild(img); }
                li.appendChild(document.createTextNode(label));
                nav.appendChild(li);
            }

            nav.addEventListener('touchstart', (e) => {
                e.preventDefault();
                nav.classList.add('open');
            });
            nav.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const t = e.touches[0];
                const el = document.elementFromPoint(t.clientX, t.clientY);
                nav.querySelectorAll('li').forEach(li => li.classList.toggle('selected', li === el || li.contains(el)));
                const key = el?.closest('li')?.dataset.key;
                if (key !== undefined) { activeSource = key; renderHistory(allItems); }
            });
            nav.addEventListener('touchend', (e) => {
                nav.classList.remove('open');
                syncHistory();
            });
            document.addEventListener('click', (e) => {
                if (!nav.contains(e.target)) nav.classList.remove('open');
            });

            renderLocalHistory();
            syncHistory();

            try {
                const res = await fetch('/config', { cache: 'no-store' });
                const config = await res.json();
                PUBLIC_VAPID_KEY = config.vapidPublicKey || '';
            } catch {
                return;
            }

            if (Notification.permission === 'default') {
                if (button) {
                    button.style.display = 'inline-block';
                    button.addEventListener('click', subscribe, { once: true });
                }
                return;
            }

            if (Notification.permission === 'granted') {
                if (window.pushManager && typeof window.pushManager.getSubscription === 'function') {
                    const existingSubscription = await window.pushManager.getSubscription();
                    if (existingSubscription) {
                        hasSubscribed = true;
                        return;
                    }
                }
                subscribe();
            }
        });
    </script>

</body>

</html>
