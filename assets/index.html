<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attention</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Attention">
</head>
<body>
    <button id="enable-notifications" style="display:none;">Enable Notifications</button>
    <section id="history"></section>

<script>
    let hasSubscribed = false;
    let PUBLIC_VAPID_KEY = '';

    function renderHistory(data) {
        const root = document.getElementById('history');
        root.replaceChildren();
        if (!data || !data.ok || !Array.isArray(data.items) || data.items.length === 0) return;

        const grouped = new Map();
        for (const item of data.items) {
            if (!grouped.has(item.sourceKey)) {
                grouped.set(item.sourceKey, {
                    sourceLabel: item.sourceLabel || item.sourceKey,
                    items: []
                });
            }
            grouped.get(item.sourceKey).items.push(item);
        }

        for (const [, group] of grouped) {
            const section = document.createElement('section');

            for (const item of group.items) {
                const entry = document.createElement('article');
                const title = document.createElement('div');
                title.textContent = item.title || item.sourceLabel || 'Notification';
                entry.appendChild(title);

                if (item.publishedAt) {
                    const time = document.createElement('div');
                    time.textContent = formatChinaTime(item.publishedAt);
                    entry.appendChild(time);
                }

                if (item.imageUrl) {
                    const image = document.createElement('img');
                    image.src = item.imageUrl;
                    image.alt = item.title || '';
                    image.style.maxWidth = '100%';
                    image.style.height = 'auto';
                    image.style.display = 'block';
                    entry.appendChild(image);
                }

                if (item.body) {
                    const body = document.createElement('p');
                    body.textContent = item.body;
                    if (item.link) {
                        body.append(document.createTextNode(' '));
                        const inlineLink = document.createElement('a');
                        inlineLink.href = item.link;
                        inlineLink.target = '_blank';
                        inlineLink.rel = 'noreferrer';
                        inlineLink.textContent = '查看原文';
                        inlineLink.style.font = 'inherit';
                        body.appendChild(inlineLink);
                    }
                    entry.appendChild(body);
                } else if (item.link) {
                    const link = document.createElement('a');
                    link.href = item.link;
                    link.target = '_blank';
                    link.rel = 'noreferrer';
                    link.textContent = '查看原文';
                    link.style.font = 'inherit';
                    entry.appendChild(link);
                }

                section.appendChild(entry);
            }
            root.appendChild(section);
        }
    }

    function formatChinaTime(value) {
        try {
            const date = new Date(value);
            const parts = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Shanghai',
                year: 'numeric',
                month: 'numeric',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: false
            }).formatToParts(date);
            const get = type => parts.find(part => part.type === type)?.value || '';
            return `${Number(get('hour'))}:${get('minute')} ${Number(get('day'))}.${Number(get('month'))}.${get('year')}`;
        } catch (err) {
            return value;
        }
    }

    async function loadHistory() {
        try {
            const res = await fetch('/history', { cache: 'no-store' });
            if (!res.ok) throw new Error('failed');
            const data = await res.json();
            renderHistory(data);
        } catch (err) {
        }
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    }

    async function subscribe() {
        try {
            if (hasSubscribed) return;
            if (!PUBLIC_VAPID_KEY) return;

            if (Notification.permission === 'default') {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') return;
            }

            if (Notification.permission !== 'granted') return;

            const existingSubscription = typeof window.pushManager.getSubscription === 'function'
                ? await window.pushManager.getSubscription()
                : null;

            const subscription = existingSubscription || await window.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
            });

            await fetch('/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(subscription)
            });

            hasSubscribed = true;
            const button = document.getElementById('enable-notifications');
            if (button) button.style.display = 'none';

        } catch (err) {
        }
    }

    window.addEventListener('load', async () => {
        const button = document.getElementById('enable-notifications');
        loadHistory();
        try {
            const res = await fetch('/config', { cache: 'no-store' });
            const config = await res.json();
            PUBLIC_VAPID_KEY = config.vapidPublicKey || '';
        } catch (err) {
            return;
        }
        if (Notification.permission === 'default') {
            if (button) {
                button.style.display = 'inline-block';
                button.addEventListener('click', subscribe, { once: true });
            }
            return;
        }

        if (Notification.permission === 'granted') {
            if (typeof window.pushManager.getSubscription === 'function') {
                const existingSubscription = await window.pushManager.getSubscription();
                if (existingSubscription) {
                    hasSubscribed = true;
                    return;
                }
            }
            subscribe();
        }
    });
</script>
</body>

</html>
